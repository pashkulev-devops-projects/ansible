---
argument_specs:
  connect:
    short_description: Connect a server to Azure Arc
    options:
      azure_arc_access_token:
        type: str
        required: true
        description: Short-lived Azure management access token.
      azure_arc_tenant_id:
        type: str
        required: true
        description: Azure tenant ID.
      azure_arc_subscription_id:
        type: str
        required: true
        description: Azure subscription ID.
      azure_arc_resource_group:
        type: str
        required: true
        description: Resource group for the Arc-enabled server.
      azure_arc_machine_name:
        type: str
        required: true
        description: Name of the Arc-enabled server resource.
      azure_arc_location:
        type: str
        required: true
        description: Azure region for the Arc-enabled server.

  disconnect:
    short_description: Disconnect a server from Azure Arc
    options:
      azure_arc_access_token:
        type: str
        required: true
        description: Short-lived Azure management access token.
